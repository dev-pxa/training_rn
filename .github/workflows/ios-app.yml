name: iOS Simulator App

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-app:
    name: Build iOS Simulator App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install native build tools
        run: brew install cmake

      - name: Install CocoaPods dependencies
        run: bundle exec pod install --project-directory=ios

      - name: Build release iOS Simulator app
        run: |
          FORCE_BUNDLING=1 xcodebuild \
            -workspace ios/train_rn.xcworkspace \
            -scheme train_rn \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Prepare versioned iOS package
        id: ios
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          APP_NAME="train_rn-v${APP_VERSION}+${GITHUB_RUN_NUMBER}-${SHORT_SHA}-ios-simulator.app.zip"
          RELEASE_TAG="ios-v${APP_VERSION}+${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          APP_PATH="ios/build/DerivedDataRelease/Build/Products/Release-iphonesimulator/train_rn.app"

          test -d "${APP_PATH}"
          test -f "${APP_PATH}/main.jsbundle"

          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "dist/${APP_NAME}"

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload iOS package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ios.outputs.app_name }}
          path: dist/${{ steps.ios.outputs.app_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "iOS Simulator app: ${{ steps.ios.outputs.app_name }}"
            echo
            echo "This release was generated automatically from the master branch."
            echo "The package is an unsigned iOS Simulator .app bundle, not a device IPA."
          } > dist/release-notes.md

          gh release create "${{ steps.ios.outputs.release_tag }}" \
            "dist/${{ steps.ios.outputs.app_name }}" \
            --target "${GITHUB_SHA}" \
            --title "iOS Simulator App v${{ steps.ios.outputs.app_version }} #${GITHUB_RUN_NUMBER}" \
            --notes-file dist/release-notes.md \
            --prerelease
