name: Android APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android

      - name: Prepare versioned APK
        id: apk
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=${GITHUB_SHA::7}
          APK_NAME="train_rn-v${APP_VERSION}+${GITHUB_RUN_NUMBER}-${SHORT_SHA}.apk"
          RELEASE_TAG="android-v${APP_VERSION}+${GITHUB_RUN_NUMBER}-${SHORT_SHA}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: dist/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.release_tag }}" \
            "dist/${{ steps.apk.outputs.apk_name }}" \
            --target "${GITHUB_SHA}" \
            --title "Android APK v${{ steps.apk.outputs.app_version }} #${GITHUB_RUN_NUMBER}" \
            --notes "Commit: ${GITHUB_SHA}

APK: ${{ steps.apk.outputs.apk_name }}

This release was generated automatically from the master branch." \
            --prerelease
