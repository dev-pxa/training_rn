<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>企业培训APP - 登录</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
<style>
        body { background-color: #f0f2f5; font-family: 'PingFang SC', sans-serif; }
        .app-container { width: 375px; height: 812px; margin: 20px auto; background: white; border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border: 8px solid #1a1a1a; }
        .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
<div class="app-container flex flex-col items-center px-8 pt-20">
<!-- 状态栏模拟 -->
<div class="absolute top-0 w-full px-6 py-2 flex justify-between items-center text-xs font-bold">
<span>09:41</span>
<div class="flex gap-1">
<span class="iconify" data-icon="solar:minimalistic-signal-strength-bold"></span>
<span class="iconify" data-icon="solar:wi-fi-bold"></span>
<span class="iconify" data-icon="solar:battery-charge-bold"></span>
</div>
</div>
<!-- 1. 企业品牌展示 Section -->
<div class="mt-10 mb-12 text-center">
<div class="w-20 h-20 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
<span class="iconify text-white text-4xl" data-icon="solar:square-academic-cap-bold"></span>
</div>
<h1 class="text-2xl font-black text-gray-800">企训通</h1>
<p class="text-gray-400 text-sm mt-2">智能家居行业领先的培训平台</p>
</div>
<!-- 2. 多租户识别 Section -->
<div class="w-full space-y-4">
<div class="group">
<label class="text-xs font-bold text-gray-500 ml-1 uppercase mb-1 block">企业验证代码</label>
<div class="flex items-center bg-gray-100 rounded-xl px-4 py-3 border-2 border-transparent focus-within:border-blue-500 transition-all">
<span class="iconify text-gray-400 mr-2" data-icon="solar:buildings-bold"></span>
<input class="bg-transparent outline-none text-sm w-full" placeholder="请输入企业唯一标识" type="text" value="SMART-HOME-01"/>
<span class="iconify text-green-500" data-icon="solar:check-read-linear"></span>
</div>
</div>
<!-- 3. 登录方式 Section -->
<div class="space-y-4 pt-4">
<div class="flex items-center bg-gray-100 rounded-xl px-4 py-3 border-2 border-transparent focus-within:border-blue-500 transition-all">
<span class="iconify text-gray-400 mr-2" data-icon="solar:user-bold"></span>
<input class="bg-transparent outline-none text-sm w-full" placeholder="工号 / 手机号" type="text"/>
</div>
<div class="flex items-center bg-gray-100 rounded-xl px-4 py-3 border-2 border-transparent focus-within:border-blue-500 transition-all">
<span class="iconify text-gray-400 mr-2" data-icon="solar:lock-password-bold"></span>
<input class="bg-transparent outline-none text-sm w-full" placeholder="请输入密码" type="password"/>
</div>
</div>
</div>
<!-- 4. 快捷操作 Section -->
<div class="w-full flex justify-between items-center mt-4 px-1">
<label class="flex items-center text-xs text-gray-500">
<input class="mr-1 rounded" type="checkbox"/> 记住我的企业
            </label>
<a class="text-xs text-blue-600 font-medium" href="#">忘记密码？</a>
</div>
<!-- 5. 提交按钮 Section -->
<div class="w-full mt-10">
<a class="block w-full bg-blue-600 text-white text-center py-4 rounded-xl font-bold shadow-xl shadow-blue-200 active:scale-95 transition-transform" href="https://modao.cc/agent-py/workspace/69ad9756526952848d991285/企业培训APP原型_v2.html/index.html?render_html=true">
                立即开启学习
            </a>
<div class="flex items-center my-6">
<div class="flex-grow border-t border-gray-100"></div>
<span class="px-4 text-xs text-gray-400 uppercase">或是</span>
<div class="flex-grow border-t border-gray-100"></div>
</div>
<button class="w-full flex items-center justify-center gap-2 border border-gray-200 py-3 rounded-xl text-sm font-medium text-gray-600">
<span class="iconify text-lg" data-icon="solar:key-minimalistic-bold"></span>
                企业SSO单点登录
            </button>
</div>
<!-- 6. 底部协议 Section -->
<div class="mt-auto pb-8 text-center">
<p class="text-[10px] text-gray-400">登入即代表您同意 <span class="text-blue-500 underline">服务协议</span> 与 <span class="text-blue-500 underline">隐私条款</span></p>
<p class="text-[10px] text-gray-300 mt-2">© 2026 SmartHome Training Lab</p>
</div>
</div>
</body>
</html>
