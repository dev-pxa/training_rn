<script>
function toggleFavorite(btn) {
    const star = btn.querySelector('path');
    const isFavorite = star.getAttribute('fill') === '#fbbf24';
    star.setAttribute('fill', isFavorite ? '#d1d5db' : '#fbbf24');
    btn.closest('.device-card').classList.toggle('is-favorite');
}

function filterFavorite() {
    const cards = document.querySelectorAll('.device-card');
    cards.forEach(card => {
        if (!card.classList.contains('is-favorite')) {
            card.style.display = card.style.display === 'none' ? 'block' : 'none';
        }
    });
}
</script>
